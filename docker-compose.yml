services:
  postgres:
    image: postgres:16
    container_name: nodejs-api-postgres-compose
    restart: unless-stopped
    environment:
      POSTGRES_DB: task_management
      POSTGRES_USER: task_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_user -d task_management"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-nodejs-api-backend:1}
    container_name: nodejs-api-backend
    restart: unless-stopped
    ports:
      - "3002:3001"
    environment:
      PORT: 3001
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: task_management
      DB_USER: task_user
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE:-nodejs-api-frontend:1}
    container_name: nodejs-api-frontend
    restart: unless-stopped
    ports:
      - "5177:80"
    depends_on:
      - backend

volumes:
  postgres_data:
